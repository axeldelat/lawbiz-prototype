<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lawbiz — Plataforma de Seguimiento</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap">

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          lawbiz: {
            dark: '#1a3a1a',
            lime: '#7cb342',
            'lime-light': '#a5d66b',
            gray: '#f5f5f5',
            'gray-mid': '#e0e0e0',
            text: '#333333',
            'text-light': '#666666',
          }
        }
      }
    }
  }
</script>

<style>
  :root {
    --lawbiz-dark: #1a3a1a;
    --lawbiz-lime: #7cb342;
    --lawbiz-lime-light: #a5d66b;
    --lawbiz-white: #ffffff;
    --lawbiz-gray: #f5f5f5;
    --lawbiz-gray-mid: #e0e0e0;
    --lawbiz-text: #333333;
    --lawbiz-text-light: #666666;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--lawbiz-gray);
    color: var(--lawbiz-text);
  }

  h1, h2, h3, .font-display {
    font-family: 'Oswald', sans-serif;
  }

  /* ---- iPhone mockup frame (CSS-only) --------------------------- */
  .iphone-frame {
    width: 280px;
    height: 560px;
    border-radius: 36px;
    border: 4px solid #1a1a1a;
    background: white;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    flex-shrink: 0;
  }
  .iphone-notch {
    width: 100px;
    height: 24px;
    background: #1a1a1a;
    border-radius: 0 0 16px 16px;
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
  }
  .iphone-home-indicator {
    width: 120px;
    height: 4px;
    background: #1a1a1a;
    border-radius: 2px;
    position: absolute;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    opacity: 0.35;
    pointer-events: none;
  }
  .iphone-content {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    overflow-y: auto;
    padding-top: 32px;
  }
  .iphone-content::-webkit-scrollbar {
    width: 0;
    height: 0;
  }

  /* ---- Interaction-feedback animations (Task 2+) ----------------- */
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .animate-fade-slide-up {
    animation: fadeSlideUp 0.45s ease-out both;
  }

  @keyframes pushSlideDown {
    from { opacity: 0; transform: translateY(-24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .push-notification {
    animation: pushSlideDown 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  @keyframes pulseDot {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
    40%           { opacity: 1;   transform: scale(1.15); }
  }
  .pulse-dot {
    animation: pulseDot 1.4s ease-in-out infinite;
  }
  .pulse-dot:nth-child(2) { animation-delay: 0.2s; }
  .pulse-dot:nth-child(3) { animation-delay: 0.4s; }

  /* ---- Checkmark "draw-in" animation (Task 3+) ------------------- */
  @keyframes drawCheck {
    0% { stroke-dashoffset: 24; }
    100% { stroke-dashoffset: 0; }
  }
  .check-animate svg path {
    stroke-dasharray: 24;
    animation: drawCheck 0.4s ease-out forwards;
  }
</style>
</head>
<body>

<!-- ================= HEADER ================= -->
<header class="fixed top-0 w-full h-16 bg-lawbiz-dark flex items-center justify-between px-6 z-50">
  <div class="flex items-center gap-2">
    <svg viewBox="0 0 150 42" class="h-8 w-auto text-white" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lawbiz">
      <g fill="currentColor">
        <!-- center blade -->
        <path d="M18 3 C14.5 9 14.5 17 18 22 C21.5 17 21.5 9 18 3 Z"/>
        <!-- inner-left / inner-right blades -->
        <path d="M9 7 C7 13 10 19 18 22 C15.5 16 12 11 9 7 Z"/>
        <path d="M27 7 C29 13 26 19 18 22 C20.5 16 24 11 27 7 Z"/>
        <!-- outer-left / outer-right blades -->
        <path d="M2 15 C3 20 9 24 18 22 C13 20 6 18 2 15 Z"/>
        <path d="M34 15 C33 20 27 24 18 22 C23 20 30 18 34 15 Z"/>
      </g>
      <!-- stem, forms the downward arrow shaft below the converging blades -->
      <path d="M18 21 L18 34" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <text x="42" y="28" fill="currentColor" font-family="Oswald, sans-serif" font-weight="600" font-size="22" letter-spacing="0.5">Lawbiz</text>
    </svg>
  </div>
  <div id="stepper" class="flex items-center gap-1" role="navigation" aria-label="Progreso del trámite">
    <!-- Generated by renderStepper(): 8 circles + connecting lines -->
  </div>
</header>

<!-- ================= MAIN CONTENT ================= -->
<main class="fixed top-16 bottom-20 w-full flex">
  <!-- Admin panel: 2/3 (gestor / desktop view) -->
  <div id="admin-panel" class="w-2/3 bg-white overflow-y-auto p-8">
  </div>
  <!-- Mobile panel: 1/3 (cliente / iPhone mockup) -->
  <div id="mobile-wrapper" class="w-1/3 bg-lawbiz-gray flex items-center justify-center">
    <div class="iphone-frame">
      <div class="iphone-notch"></div>
      <div id="mobile-content" class="iphone-content">
        <!-- Mobile screens render here -->
      </div>
      <div class="iphone-home-indicator"></div>
    </div>
  </div>
</main>

<!-- ================= BOTTOM BAR ================= -->
<footer class="fixed bottom-0 w-full h-20 bg-lawbiz-dark flex items-center px-6 z-50 gap-4">
  <button id="btn-prev" type="button" class="px-4 py-2 bg-white/20 hover:bg-white/30 text-white rounded-lg text-sm cursor-pointer transition-colors">← Atrás</button>
  <div id="narrative" class="flex-1 text-center text-white px-2" aria-live="polite">
    <p id="narrative-text" class="text-sm leading-snug"></p>
  </div>
  <button id="btn-next" type="button" class="px-4 py-2 bg-lawbiz-lime hover:bg-lawbiz-lime-light text-lawbiz-dark font-semibold rounded-lg text-sm cursor-pointer transition-colors">Siguiente →</button>
</footer>

<script>
/* ================================================================
   LAWBIZ PROTOTYPE — STATE MACHINE AND RENDER LOGIC

   Single-file interactive demo shell. 8 process steps (indices 0-7)
   drive the STEPS array below; index 8 is the closing CTA screen,
   handled as a special case (it has no STEPS entry).

   renderAdminPanel() / renderMobilePanel() are placeholder stubs in
   this task — later tasks replace their contents per step, keeping
   the same (step, interactionState) signature.
   ================================================================ */

/* ---------------- STEP DATA ---------------- */
const STEPS = [
  { id: 'dashboard', title: 'Dashboard', narrative: 'El gestor ve todos sus casos activos de un vistazo. Cada cliente tiene su propio seguimiento en tiempo real.', interactions: [] },
  { id: 'alta', title: 'Alta de caso', narrative: 'El gestor ingresa los datos y abre un nuevo expediente. El cliente recibe acceso inmediato a su panel y puede realizar su pago directamente en la plataforma.', interactions: ['crear-expediente'],
    interactionNarratives: {
      'crear-expediente': 'El cliente ya tiene acceso a su panel y puede realizar su pago inicial directamente desde la app. Revisa la vista del cliente →',
    } },
  { id: 'solicitud', title: 'Solicitud', narrative: 'El sistema genera automáticamente la solicitud con los datos del expediente. Tu cliente recibe instrucciones claras sin que tengas que escribir un solo mensaje.', interactions: ['generar-solicitud', 'enviar-requisicion'],
    interactionNarratives: {
      'generar-solicitud': 'La solicitud quedó generada automáticamente con los datos del expediente, lista para enviarse a firma.',
      'enviar-requisicion': 'El cliente recibió una notificación push con instrucciones para firmar y subir su documento. Revisa la vista del cliente →',
    } },
  { id: 'firma', title: 'Documentos firmados', narrative: 'Cuando el cliente sube sus documentos, el gestor los recibe al instante. No más fotos por WhatsApp sin contexto.', interactions: ['confirmar-recepcion'],
    interactionNarratives: {
      'confirmar-recepcion': 'Recepción confirmada. El expediente queda marcado como listo para ingresarse ante COFEPRIS.',
    } },
  { id: 'cofepris', title: 'Ingreso COFEPRIS', narrative: 'El gestor registra el ingreso y el cliente ve su folio y estado en tiempo real. Sin necesidad de preguntar por WhatsApp cuánto falta.', interactions: ['registrar-ingreso'],
    interactionNarratives: {
      'registrar-ingreso': 'Folio y guía de seguimiento registrados. El cliente ya ve el estatus de su trámite en tiempo real desde la app. Revisa la vista del cliente →',
    } },
  { id: 'respuesta', title: 'Respuesta COFEPRIS', narrative: 'La respuesta de la autoridad se registra y el cliente se entera de inmediato. El pago se gestiona dentro de la plataforma — no más transferencias manuales.', interactions: ['notificar-cliente'],
    interactionNarratives: {
      'notificar-cliente': 'El cliente fue notificado y ya puede pagar el siguiente paso directamente desde la app. Revisa la vista del cliente →',
    } },
  { id: 'didgi', title: 'Denuncia (DIDGI)', narrative: 'El último escrito se genera con toda la información del caso. El cliente recibe instrucciones paso a paso, incluyendo la opción de pagar una guía prepagada.', interactions: ['generar-didgi', 'enviar-requisicion-2'] },
  { id: 'espera-final', title: 'Espera final', narrative: 'El cliente ve todo su proceso de un vistazo: qué pasó, cuándo, y qué falta. Tranquilidad total.', interactions: [] },
];

/* ---------------- APP STATE MACHINE ---------------- */
const app = {
  currentStep: 0,
  interactionState: {},

  goTo(step) {
    if (step < 0 || step > 8) return;
    this.currentStep = step;
    this.interactionState = {};
    this.render();
  },
  next() { this.goTo(this.currentStep + 1); },
  prev() { this.goTo(this.currentStep - 1); },

  render() {
    renderStepper(this.currentStep);
    renderAdminPanel(this.currentStep, this.interactionState);
    renderMobilePanel(this.currentStep, this.interactionState);
    renderNarrative(this.currentStep);
    renderNavButtons(this.currentStep);
  },

  triggerInteraction(id) {
    this.interactionState[id] = true;
    renderAdminPanel(this.currentStep, this.interactionState);
    renderMobilePanel(this.currentStep, this.interactionState);
    const step = STEPS[this.currentStep];
    if (step && step.interactionNarratives && step.interactionNarratives[id]) {
      document.getElementById('narrative-text').textContent = step.interactionNarratives[id];
    }
  }
};

/* ---------------- STEPPER (header) ---------------- */
function renderStepper(currentStep) {
  const stepper = document.getElementById('stepper');
  stepper.innerHTML = '';
  for (let i = 0; i < 8; i++) {
    if (i > 0) {
      const line = document.createElement('div');
      line.className = `w-6 h-0.5 ${i <= currentStep ? 'bg-lawbiz-lime' : 'bg-gray-600'}`;
      stepper.appendChild(line);
    }
    const circle = document.createElement('div');
    const isActive = i === currentStep;
    const isCompleted = i < currentStep;
    circle.className = `w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold cursor-pointer transition-all ${
      isActive ? 'bg-lawbiz-lime text-lawbiz-dark scale-110' :
      isCompleted ? 'bg-lawbiz-lime/70 text-white' :
      'bg-gray-600 text-gray-300'
    }`;
    circle.textContent = isCompleted ? '✓' : i + 1;
    circle.setAttribute('role', 'button');
    circle.setAttribute('aria-label', `Ir al paso ${i + 1}: ${STEPS[i].title}`);
    if (isActive) circle.setAttribute('aria-current', 'step');
    circle.onclick = () => app.goTo(i);
    stepper.appendChild(circle);
  }
}

/* ---------------- SHARED DATA (Pantallas 1-3) ---------------- */
const CASES = [
  { cliente: 'María García López',   expediente: 'EXP-2026-001', estado: 'En trámite',          fecha: '15/03/2026' },
  { cliente: 'Roberto Méndez Parra', expediente: 'EXP-2026-002', estado: 'Esperando COFEPRIS',   fecha: '28/01/2026' },
  { cliente: 'Laura Sánchez Vidal',  expediente: 'EXP-2026-003', estado: 'Nuevo',                fecha: '01/09/2026' },
  { cliente: 'Carlos Reyes Fuentes', expediente: 'EXP-2026-004', estado: 'Resuelto',             fecha: '10/11/2025' },
  { cliente: 'Ana Lucía Torres',     expediente: 'EXP-2026-005', estado: 'En trámite',            fecha: '22/06/2026' },
];

/* Estado -> badge color. Matched by prefix so "Esperando COFEPRIS"
   still maps to the "Esperando" (orange) treatment. */
function estadoBadgeClasses(estado) {
  if (estado.indexOf('Nuevo') === 0)      return 'bg-blue-100 text-blue-700';
  if (estado.indexOf('En trámite') === 0) return 'bg-yellow-100 text-yellow-700';
  if (estado.indexOf('Esperando') === 0)  return 'bg-orange-100 text-orange-700';
  if (estado.indexOf('Resuelto') === 0)   return 'bg-green-100 text-green-700';
  if (estado.indexOf('Respuesta') === 0)  return 'bg-amber-100 text-amber-700';
  return 'bg-gray-100 text-gray-700';
}

/* ---------------- SHARED UI HELPERS ---------------- */

/* Icon-only crop of the header logo mark (leaf-fan + stem, no
   wordmark) so it can be reused at any size/color via currentColor —
   mobile splash (green, large), PDF letterhead (dark, small), push
   notification (white, tiny). */
function logoIconSvg(extraClass) {
  return `<svg viewBox="0 0 36 42" class="${extraClass || ''}" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lawbiz">
    <g fill="currentColor">
      <path d="M18 3 C14.5 9 14.5 17 18 22 C21.5 17 21.5 9 18 3 Z"/>
      <path d="M9 7 C7 13 10 19 18 22 C15.5 16 12 11 9 7 Z"/>
      <path d="M27 7 C29 13 26 19 18 22 C20.5 16 24 11 27 7 Z"/>
      <path d="M2 15 C3 20 9 24 18 22 C13 20 6 18 2 15 Z"/>
      <path d="M34 15 C33 20 27 24 18 22 C23 20 30 18 34 15 Z"/>
    </g>
    <path d="M18 21 L18 34" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  </svg>`;
}

/* Read-only "pre-filled by the gestor" field used on Alta de caso. */
function readonlyField(label, value, spanClass) {
  return `
    <div class="${spanClass || ''}">
      <label class="block text-xs font-semibold text-lawbiz-text-light mb-1">${label}</label>
      <input type="text" value="${value}" readonly aria-readonly="true"
        class="w-full px-3 py-2 bg-lawbiz-gray border border-lawbiz-gray-mid rounded-lg text-sm text-lawbiz-text cursor-not-allowed">
    </div>`;
}

/* Editable field pre-filled with a value (Pantalla 5's COFEPRIS form —
   unlike readonlyField, the gestor can still type into these). */
function inputField(label, value, spanClass) {
  return `
    <div class="${spanClass || ''}">
      <label class="block text-xs font-semibold text-lawbiz-text-light mb-1">${label}</label>
      <input type="text" value="${value}"
        class="w-full px-3 py-2 bg-white border border-lawbiz-gray-mid rounded-lg text-sm text-lawbiz-text focus:outline-none focus:ring-2 focus:ring-lawbiz-lime/40">
    </div>`;
}

/* Generic "document" icon used by the amber attention cards on
   Pantallas 4 and 6 (new documents / response arrived). */
function fileIconSvg(extraClass) {
  return `<svg viewBox="0 0 24 24" class="${extraClass || ''}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
    <path d="M14 2v6h6"/>
  </svg>`;
}

/* Shared case header for Pantallas 3-6 (same client throughout, only
   the estado badge changes). Mirrors the header markup introduced by
   renderSolicitudAdmin in Task 2. */
function caseHeaderMarkup(estado) {
  return `
    <div class="flex items-center gap-3 mb-6 flex-wrap">
      <h1 class="font-display text-2xl text-lawbiz-dark">María García López <span class="text-lawbiz-text-light font-normal text-lg">— EXP-2026-001</span></h1>
      <span class="px-2.5 py-1 rounded-full text-xs font-semibold whitespace-nowrap ${estadoBadgeClasses(estado)}">${estado}</span>
    </div>`;
}

/* ---------------- REUSABLE MOBILE TIMELINE ----------------
   Vertical progress timeline for the client's iPhone view. Built for
   Pantalla 3 (this task) but written generically so Tasks 3-4 can
   reuse it for Pantallas 4-7: pass an ordered list of
   { label, status, detail } items, status one of
   'completed' | 'active' | 'pending'. 'detail' is optional HTML shown
   expanded under an 'active' item (e.g. signing instructions). */
function renderMobileTimeline(items, opts) {
  opts = opts || {};
  const rows = items.map((item, i) => {
    const isLast = i === items.length - 1;
    const circleClasses = item.status === 'completed'
      ? 'bg-lawbiz-lime text-white'
      : item.status === 'active'
        ? 'bg-lawbiz-lime text-white ring-4 ring-lawbiz-lime/25'
        : 'bg-lawbiz-gray-mid text-lawbiz-text-light';
    const labelClasses = item.status === 'pending' ? 'text-lawbiz-text-light' : 'text-lawbiz-dark';
    const lineClasses = item.status === 'completed' ? 'bg-lawbiz-lime' : 'bg-lawbiz-gray-mid';
    // Plain "✓" glyph by default. Items that just transitioned to
    // completed in THIS render can set `checkAnimate: true` to get an
    // SVG check that draws itself in via the .check-animate CSS
    // animation instead of appearing instantly.
    const glyph = item.status === 'completed'
      ? (item.checkAnimate
          ? `<span class="check-animate inline-flex"><svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 L9.5 18 L20 6"/></svg></span>`
          : '✓')
      : String(i + 1);
    const detail = (item.status === 'active' && item.detail)
      ? `<div class="mt-2 animate-fade-slide-up">${item.detail}</div>`
      : '';

    return `
      <div class="flex gap-3 ${isLast ? '' : 'pb-6'}">
        <div class="flex flex-col items-center">
          <div class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold shrink-0 ${circleClasses}">${glyph}</div>
          ${isLast ? '' : `<div class="w-0.5 flex-1 mt-1 ${lineClasses}"></div>`}
        </div>
        <div class="flex-1 pt-0.5 min-w-0">
          <p class="text-sm font-semibold ${labelClasses}">${item.label}</p>
          ${detail}
        </div>
      </div>`;
  }).join('');

  return `
    <div class="px-5 py-6">
      ${opts.heading ? `<h3 class="font-display text-lg text-lawbiz-dark mb-4">${opts.heading}</h3>` : ''}
      ${rows}
    </div>`;
}

/* ---------------- PANTALLA 1: DASHBOARD ---------------- */
function renderDashboardAdmin() {
  const rows = CASES.map(c => {
    const isMaria = c.cliente === 'María García López';
    return `
      <tr class="${isMaria ? 'bg-lawbiz-lime/10' : 'hover:bg-lawbiz-gray/60'} transition-colors">
        <td class="px-4 py-3 font-medium text-lawbiz-dark border-l-4 ${isMaria ? 'border-lawbiz-lime' : 'border-transparent'}">${c.cliente}</td>
        <td class="px-4 py-3 text-lawbiz-text-light font-mono text-xs">${c.expediente}</td>
        <td class="px-4 py-3"><span class="px-2.5 py-1 rounded-full text-xs font-semibold whitespace-nowrap ${estadoBadgeClasses(c.estado)}">${c.estado}</span></td>
        <td class="px-4 py-3 text-lawbiz-text-light">${c.fecha}</td>
      </tr>`;
  }).join('');

  return `
    <div>
      <div class="mb-6">
        <h1 class="font-display text-3xl text-lawbiz-dark">Dashboard</h1>
        <p class="text-sm text-lawbiz-text-light mt-1">Todos tus casos activos, de un vistazo.</p>
      </div>
      <div class="overflow-x-auto rounded-xl border border-lawbiz-gray-mid">
        <table class="w-full text-sm text-left">
          <thead class="bg-lawbiz-gray text-lawbiz-text-light uppercase text-xs tracking-wide">
            <tr>
              <th class="px-4 py-3 font-semibold">Cliente</th>
              <th class="px-4 py-3 font-semibold">Expediente</th>
              <th class="px-4 py-3 font-semibold">Estado</th>
              <th class="px-4 py-3 font-semibold">Fecha inicio</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-lawbiz-gray-mid">
            ${rows}
          </tbody>
        </table>
      </div>
    </div>`;
}

function renderDashboardMobile() {
  return `
    <div class="h-full flex flex-col items-center justify-center text-center gap-1 px-8">
      <div class="text-lawbiz-lime w-16 h-16 mb-2">${logoIconSvg('w-full h-full')}</div>
      <h2 class="font-display text-xl text-lawbiz-dark">Bienvenido a Lawbiz</h2>
      <p class="text-sm text-lawbiz-text-light">Seguimiento de tu trámite legal</p>
      <div class="flex gap-1.5 mt-6" role="status" aria-label="Cargando">
        <span class="pulse-dot w-2 h-2 rounded-full bg-lawbiz-lime"></span>
        <span class="pulse-dot w-2 h-2 rounded-full bg-lawbiz-lime"></span>
        <span class="pulse-dot w-2 h-2 rounded-full bg-lawbiz-lime"></span>
      </div>
    </div>`;
}

/* ---------------- PANTALLA 2: ALTA DE CASO ---------------- */
function renderAltaAdmin(interactionState) {
  const created = !!interactionState['crear-expediente'];
  return `
    <div>
      <div class="flex items-start justify-between gap-4 mb-6">
        <div>
          <h1 class="font-display text-3xl text-lawbiz-dark">Nuevo expediente</h1>
          <p class="text-sm text-lawbiz-text-light mt-1">Verifica los datos capturados del cliente antes de abrir su caso.</p>
        </div>
        ${created ? `<span class="inline-flex items-center gap-2 px-4 py-2 bg-green-100 text-green-700 rounded-lg font-semibold text-sm shrink-0 whitespace-nowrap">✓ Expediente EXP-2026-001 creado</span>` : ''}
      </div>

      <div class="grid grid-cols-2 gap-4 max-w-2xl">
        ${readonlyField('Nombre completo', 'María García López', 'col-span-2')}
        ${readonlyField('CURP', 'GALM890512MYNRPR01', 'col-span-2')}
        ${readonlyField('Domicilio', 'Av. Reforma 234, Col. Centro, Mérida, Yucatán, CP 97000', 'col-span-2')}
        ${readonlyField('Teléfono', '+52 999 123 4567')}
        ${readonlyField('Correo electrónico', 'maria.garcia@email.com')}
      </div>

      <div class="mt-8 max-w-2xl">

    { label: 'Expediente creado', status: 'completed' },
    { label: 'Pago inicial', status: 'completed' },
    { label: 'Solicitud firmada', status: 'completed' },
    { label: 'Documentos firmados', status: 'completed' },
    { label: 'Ingreso ante COFEPRIS', status: 'completed' },
    {
      label: 'Respuesta de COFEPRIS',
      status: 'active',
      detail: notified
        ? `
          <div class="bg-white border border-lawbiz-gray-mid rounded-lg p-3 space-y-3">
            <p class="text-sm font-semibold text-lawbiz-dark">COFEPRIS ha emitido su respuesta</p>
            <details class="bg-lawbiz-gray rounded-lg p-3">
              <summary class="text-xs font-semibold text-lawbiz-dark cursor-pointer select-none">Ver resumen de la respuesta</summary>
              <div class="mt-2 pt-2 border-t border-lawbiz-gray-mid space-y-1.5">
                <p class="text-[11px] text-lawbiz-text-light leading-relaxed">Oficio 263301EL789456 — COFEPRIS resuelve favorablemente la solicitud de autorización sanitaria para consumo personal.</p>
                <div class="h-1 bg-lawbiz-gray-mid rounded w-full"></div>
                <div class="h-1 bg-lawbiz-gray-mid rounded w-4/5"></div>
              </div>
            </details>
            <hr class="border-lawbiz-gray-mid">
            <div class="bg-lawbiz-gray rounded-xl p-3">
              <p class="text-[11px] font-semibold text-lawbiz-lime uppercase tracking-wide mb-2">Pago requerido</p>
              ${stripeFormMarkup('$1,000 MXN')}
            </div>
          </div>`
        : `<span class="inline-flex items-center gap-1.5 text-xs text-amber-700 bg-amber-50 px-2 py-1 rounded-md"><span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>La autoridad ha respondido — Revisa los detalles</span>`,
    },
  ];

  const notification = notified ? `
    <div class="push-notification mx-3 mt-3 bg-white rounded-xl shadow-lg border border-lawbiz-gray-mid px-3 py-2.5 flex items-center gap-2.5">
      <div class="w-7 h-7 rounded-md bg-lawbiz-dark flex items-center justify-center shrink-0 text-white p-1.5">${logoIconSvg('w-full h-full')}</div>
      <div class="flex-1 min-w-0">
        <p class="text-xs font-semibold text-lawbiz-dark leading-tight">Lawbiz — Respuesta recibida</p>
        <p class="text-[10px] text-lawbiz-text-light leading-tight truncate">COFEPRIS respondió tu solicitud. Toca para ver el detalle.</p>
      </div>
    </div>` : '';

  return `${notification}${renderMobileTimeline(items, { heading: 'Tu trámite' })}`;
}

/* ---------------- PANEL PLACEHOLDERS ----------------
   Task 1 only renders stub content (title + id) so the shell can be
   verified end-to-end. Later tasks replace the bodies of
   renderAdminPanel() / renderMobilePanel() with real per-step screens,
   keeping this same (step, interactionState) signature. */
function placeholderContent(label, step, s, interactionState) {
  const activeInteractions = Object.keys(interactionState);
  return `
    <div class="h-full min-h-[300px] flex flex-col items-center justify-center text-center gap-2 text-lawbiz-text-light p-6">
      <span class="uppercase text-xs tracking-widest text-lawbiz-lime font-semibold">${label} · Paso ${step + 1} de 9</span>
      <h2 class="font-display text-2xl text-lawbiz-dark">${s.title}</h2>
      <p class="text-xs text-lawbiz-text-light">id: <code class="bg-lawbiz-gray-mid/60 px-1.5 py-0.5 rounded">${s.id}</code></p>
      <p class="text-sm max-w-xs mt-2">Contenido de esta pantalla pendiente de construir.</p>
      ${activeInteractions.length ? `<p class="text-xs mt-3 text-lawbiz-lime">Interacción activa: ${activeInteractions.join(', ')}</p>` : ''}
    </div>`;
}

function ctaPlaceholder(label) {
  return `
    <div class="h-full min-h-[300px] flex flex-col items-center justify-center text-center gap-2 text-lawbiz-text-light p-6">
      <span class="uppercase text-xs tracking-widest text-lawbiz-lime font-semibold">${label} · Paso 9 de 9</span>
      <h2 class="font-display text-2xl text-lawbiz-dark">Cierre — Llamado a la acción</h2>
      <p class="text-xs text-lawbiz-text-light">id: <code class="bg-lawbiz-gray-mid/60 px-1.5 py-0.5 rounded">cta</code></p>
      <p class="text-sm max-w-xs mt-2">Pantalla de cierre pendiente de construir.</p>
    </div>`;
}

function renderAdminPanel(step, interactionState) {
  const panel = document.getElementById('admin-panel');
  if (step >= STEPS.length) {
    panel.innerHTML = ctaPlaceholder('Panel del gestor');
    return;
  }

  if (step === 0) {
    panel.innerHTML = renderDashboardAdmin();
    return;
  }
  if (step === 1) {
    panel.innerHTML = renderAltaAdmin(interactionState);
    // Wire onclick INSIDE the render function: the DOM is rebuilt on
    // every render, so listeners attached elsewhere would be lost.
    const btnCrear = document.getElementById('btn-crear-expediente');
    if (btnCrear) btnCrear.onclick = () => app.triggerInteraction('crear-expediente');
    return;
  }
  if (step === 2) {
    panel.innerHTML = renderSolicitudAdmin(interactionState);
    const btnGenerar = document.getElementById('btn-generar-solicitud');
    if (btnGenerar) btnGenerar.onclick = () => app.triggerInteraction('generar-solicitud');
    const btnEnviar = document.getElementById('btn-enviar-requisicion');
    if (btnEnviar) btnEnviar.onclick = () => app.triggerInteraction('enviar-requisicion');
    return;
  }
  if (step === 3) {
    panel.innerHTML = renderFirmaAdmin(interactionState);
    const btnConfirmar = document.getElementById('btn-confirmar-recepcion');
    if (btnConfirmar) btnConfirmar.onclick = () => app.triggerInteraction('confirmar-recepcion');
    return;
  }
  if (step === 4) {
    panel.innerHTML = renderCofeprisAdmin(interactionState);
    const btnRegistrar = document.getElementById('btn-registrar-ingreso');
    if (btnRegistrar) btnRegistrar.onclick = () => app.triggerInteraction('registrar-ingreso');
    return;
  }
  if (step === 5) {
    panel.innerHTML = renderRespuestaAdmin(interactionState);
    const btnNotificar = document.getElementById('btn-notificar-cliente');
    if (btnNotificar) btnNotificar.onclick = () => app.triggerInteraction('notificar-cliente');
    return;
  }

  panel.innerHTML = placeholderContent('Panel del gestor', step, STEPS[step], interactionState);
}

function renderMobilePanel(step, interactionState) {
  const panel = document.getElementById('mobile-content');
  if (step >= STEPS.length) {
    panel.innerHTML = ctaPlaceholder('Vista del cliente');
    return;
  }

  if (step === 0) {
    panel.innerHTML = renderDashboardMobile();
    return;
  }
  if (step === 1) {
    panel.innerHTML = renderAltaMobile(interactionState);
    return;
  }
  if (step === 2) {
    panel.innerHTML = renderSolicitudMobile(interactionState);
    return;
  }
  if (step === 3) {
    panel.innerHTML = renderFirmaMobile(interactionState);
    return;
  }
  if (step === 4) {
    panel.innerHTML = renderCofeprisMobile(interactionState);
    return;
  }
  if (step === 5) {
    panel.innerHTML = renderRespuestaMobile(interactionState);
    return;
  }

  panel.innerHTML = placeholderContent('Vista del cliente', step, STEPS[step], interactionState);
}

/* ---------------- NARRATIVE BAR ---------------- */
function renderNarrative(step) {
  const el = document.getElementById('narrative-text');
  if (step >= STEPS.length) {
    el.textContent = '';
    return;
  }
  el.textContent = STEPS[step].narrative;
  const s = STEPS[step];
  if (s.interactions.length > 0 && !Object.keys(app.interactionState).length) {
    el.textContent += ' 👆 Haz clic en los botones resaltados para ver la interacción.';
  }
}

/* ---------------- NAV BUTTONS ---------------- */
function renderNavButtons(step) {
  const prev = document.getElementById('btn-prev');
  const next = document.getElementById('btn-next');

  prev.disabled = step === 0;
  prev.className = step === 0
    ? 'opacity-30 cursor-not-allowed px-4 py-2 bg-white/10 text-white rounded-lg text-sm'
    : 'px-4 py-2 bg-white/20 hover:bg-white/30 text-white rounded-lg text-sm cursor-pointer transition-colors';

  if (step >= 8) {
    next.textContent = '';
    next.disabled = true;
    next.className = 'hidden';
  } else if (step === 7) {
    next.disabled = false;
    next.textContent = 'Ver cierre →';
    next.className = 'px-4 py-2 bg-lawbiz-lime hover:bg-lawbiz-lime-light text-lawbiz-dark font-semibold rounded-lg text-sm cursor-pointer transition-colors';
  } else {
    next.disabled = false;
    next.textContent = 'Siguiente →';
    next.className = 'px-4 py-2 bg-lawbiz-lime hover:bg-lawbiz-lime-light text-lawbiz-dark font-semibold rounded-lg text-sm cursor-pointer transition-colors';
  }
}

/* ---------------- EVENT WIRING + INIT ---------------- */
document.getElementById('btn-prev').onclick = () => app.prev();
document.getElementById('btn-next').onclick = () => app.next();
document.addEventListener('DOMContentLoaded', () => app.render());
</script>
</body>
</html>
